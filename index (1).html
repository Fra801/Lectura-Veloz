<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lector veloz</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root { --bg:#111418; --panel:#1b2027; --fg:#eceff4; --muted:#8b95a5; --accent:#ff5a4f; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  .wrap { max-width: 820px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 20px; margin: 4px 0 12px; }
  .card { background: var(--panel); border-radius: 12px; padding: 14px; margin-bottom: 14px; }
  textarea { width:100%; height:140px; background:#0e1115; color:var(--fg); border:1px solid #2a323d; border-radius:8px; padding:10px; font-size:14px; resize:vertical; }
  button, .btn { background:#2a323d; color:var(--fg); border:0; border-radius:8px; padding:10px 14px; font-size:15px; cursor:pointer; }
  button.primary { background: var(--accent); color:#fff; font-weight:600; }
  button:disabled { opacity:.5; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:10px; }
  label { font-size:13px; color:var(--muted); display:flex; flex-direction:column; gap:4px; flex:1; min-width:140px; }
  label b { color:var(--fg); font-weight:600; }
  input[type=range] { width:100%; }
  #status { font-size:13px; color:var(--muted); margin-top:8px; min-height:18px; }
  #stage { background:#0b0d10; border-radius:12px; height:200px; display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden; }
  #stage::before, #stage::after { content:""; position:absolute; left:50%; width:2px; height:22px; background:#2a323d; transform:translateX(-50%); }
  #stage::before { top:0; } #stage::after { bottom:0; }
  #word { font-family: Georgia, 'Times New Roman', serif; white-space:pre; text-align:center; line-height:1.2; }
  .orp { display:grid; grid-template-columns: 1fr auto 1fr; width:100%; }
  .orp .l { text-align:right; } .orp .c { color:var(--accent); } .orp .r { text-align:left; }
  #progress { margin-top:12px; }
  .small { font-size:12px; color:var(--muted); }
  .check { flex-direction:row; align-items:center; gap:8px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Lector veloz</h1>

  <div class="card">
    <textarea id="txt" placeholder="Pegá acá un texto, o cargá un archivo TXT, PDF o EPUB..."></textarea>
    <div class="row">
      <input type="file" id="file" accept=".txt,.pdf,.epub" style="display:none">
      <button id="pick">Cargar archivo</button>
      <button id="load" class="primary">Usar este texto</button>
    </div>
    <div id="status"></div>
  </div>

  <div id="stage"><div id="word"></div></div>

  <div class="card" style="margin-top:14px">
    <div class="row" style="margin-top:0">
      <button id="back">⏪ -50</button>
      <button id="play" class="primary" style="flex:1" disabled>▶ Leer</button>
      <button id="fwd">+50 ⏩</button>
    </div>
    <div id="progress">
      <input type="range" id="pos" min="0" max="0" value="0">
      <div class="small" id="posInfo">0 / 0 palabras</div>
    </div>
    <div class="row">
      <label>Velocidad: <b id="wpmV">400</b> ppm
        <input type="range" id="wpm" min="100" max="1500" step="10" value="400"></label>
      <label>Palabras por vez: <b id="grpV">1</b>
        <input type="range" id="grp" min="1" max="5" step="1" value="1"></label>
      <label>Tamaño de letra: <b id="sizeV">48</b> px
        <input type="range" id="size" min="20" max="110" step="2" value="48"></label>
    </div>
    <div class="row">
      <label class="check"><input type="checkbox" id="punct" checked> Pausa extra en puntuación</label>
      <label class="check"><input type="checkbox" id="orp" checked> Resaltar letra central (1 palabra)</label>
    </div>
    <div class="small" style="margin-top:10px">Atajos: Espacio = pausa/seguir · ← → = ±10 palabras · ↑ ↓ = velocidad ±25</div>
  </div>
</div>

<script>
(function () {
  var words = [], idx = 0, playing = false, timer = null, docKey = '';
  var $ = function (id) { return document.getElementById(id); };

  // ---------- Persistencia (opcional, puede no estar disponible) ----------
  function save(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  ['wpm', 'grp', 'size'].forEach(function (id) {
    var v = load('lv_' + id); if (v) $(id).value = v;
  });

  // ---------- UI ----------
  function refreshLabels() {
    $('wpmV').textContent = $('wpm').value;
    $('grpV').textContent = $('grp').value;
    $('sizeV').textContent = $('size').value;
    $('word').style.fontSize = $('size').value + 'px';
    ['wpm', 'grp', 'size'].forEach(function (id) { save('lv_' + id, $(id).value); });
  }
  ['wpm', 'grp', 'size'].forEach(function (id) { $(id).addEventListener('input', refreshLabels); });
  refreshLabels();

  function status(msg) { $('status').textContent = msg || ''; }

  function render() {
    var g = parseInt($('grp').value, 10);
    var chunk = words.slice(idx, idx + g);
    var el = $('word');
    if (!chunk.length) { el.innerHTML = ''; return; }
    if (g === 1 && $('orp').checked) {
      var w = chunk[0], n = w.length;
      var p = n <= 1 ? 0 : n <= 5 ? 1 : n <= 9 ? 2 : n <= 13 ? 3 : 4;
      el.innerHTML = '<div class="orp"><span class="l">' + esc(w.slice(0, p)) + '</span><span class="c">' +
        esc(w.charAt(p)) + '</span><span class="r">' + esc(w.slice(p + 1)) + '</span></div>';
      el.style.width = '100%';
    } else {
      el.style.width = 'auto';
      el.textContent = chunk.join(' ');
    }
    $('pos').value = idx;
    $('posInfo').textContent = idx + ' / ' + words.length + ' palabras  (' + Math.round(100 * idx / Math.max(1, words.length)) + '%)';
  }
  function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

  // ---------- Motor de lectura ----------
  function delayFor(chunk) {
    var base = 60000 / parseInt($('wpm').value, 10) * chunk.length;
    if ($('punct').checked) {
      var last = chunk[chunk.length - 1] || '';
      if (/[.!?…]["')\]]*$/.test(last)) base *= 1.8;
      else if (/[,;:]["')\]]*$/.test(last)) base *= 1.35;
    }
    return base;
  }
  function tick() {
    if (!playing) return;
    render();
    var g = parseInt($('grp').value, 10);
    var chunk = words.slice(idx, idx + g);
    idx += g;
    if (idx >= words.length) { stop(); idx = words.length; $('posInfo').textContent += '  — fin'; return; }
    timer = setTimeout(tick, delayFor(chunk));
  }
  function start() {
    if (!words.length) return;
    if (idx >= words.length) idx = 0;
    playing = true; $('play').textContent = '⏸ Pausa'; tick();
  }
  function stop() {
    playing = false; clearTimeout(timer); $('play').textContent = '▶ Leer';
    if (docKey) save('lv_pos_' + docKey, idx);
  }
  function toggle() { playing ? stop() : start(); }
  function jump(n) {
    var was = playing; if (was) stop();
    idx = Math.max(0, Math.min(words.length - 1, idx + n)); render();
    if (was) start();
  }

  $('play').addEventListener('click', toggle);
  $('back').addEventListener('click', function () { jump(-50); });
  $('fwd').addEventListener('click', function () { jump(50); });
  $('pos').addEventListener('input', function () {
    var was = playing; if (was) stop();
    idx = parseInt($('pos').value, 10); render();
    if (was) start();
  });
  $('orp').addEventListener('change', render);
  document.addEventListener('keydown', function (e) {
    if (e.target.tagName === 'TEXTAREA') return;
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    else if (e.code === 'ArrowLeft') jump(-10);
    else if (e.code === 'ArrowRight') jump(10);
    else if (e.code === 'ArrowUp') { $('wpm').value = Math.min(1500, +$('wpm').value + 25); refreshLabels(); }
    else if (e.code === 'ArrowDown') { $('wpm').value = Math.max(100, +$('wpm').value - 25); refreshLabels(); }
  });

  // ---------- Cargar texto ----------
  function setText(text, name) {
    stop();
    words = text.replace(/\s+/g, ' ').trim().split(' ').filter(Boolean);
    docKey = (name || 'pegado') + '_' + words.length;
    var saved = parseInt(load('lv_pos_' + docKey) || '0', 10);
    idx = (saved > 0 && saved < words.length) ? saved : 0;
    $('pos').max = Math.max(0, words.length - 1);
    $('play').disabled = !words.length;
    render();
    status(words.length ? words.length + ' palabras cargadas' + (idx ? ' · retomando en la palabra ' + idx : '') + '.' : 'No se encontró texto.');
  }
  $('load').addEventListener('click', function () { setText($('txt').value, 'pegado'); });
  $('pick').addEventListener('click', function () { $('file').click(); });

  $('file').addEventListener('change', function () {
    var f = this.files[0]; if (!f) return;
    var ext = f.name.split('.').pop().toLowerCase();
    status('Procesando "' + f.name + '"...');
    var p = ext === 'pdf' ? readPdf(f) : ext === 'epub' ? readEpub(f) : readTxt(f);
    p.then(function (text) { $('txt').value = text.slice(0, 200000); setText(text, f.name); })
     .catch(function (err) { status('Error: ' + (err && err.message ? err.message : err)); });
  });

  function readTxt(f) {
    return new Promise(function (res, rej) {
      var r = new FileReader(); r.onload = function () { res(r.result); }; r.onerror = rej; r.readAsText(f);
    });
  }
  function readBuf(f) {
    return new Promise(function (res, rej) {
      var r = new FileReader(); r.onload = function () { res(r.result); }; r.onerror = rej; r.readAsArrayBuffer(f);
    });
  }

  // ---------- PDF ----------
  var workerReady = null;
  function pdfWorker() {
    if (workerReady) return workerReady;
    var url = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    workerReady = fetch(url).then(function (r) { return r.text(); }).then(function (code) {
      pdfjsLib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(new Blob([code], { type: 'text/javascript' }));
    });
    return workerReady;
  }
  function readPdf(f) {
    return Promise.all([readBuf(f), pdfWorker()]).then(function (r) {
      return pdfjsLib.getDocument({ data: r[0] }).promise;
    }).then(function (pdf) {
      var out = [], chain = Promise.resolve();
      for (var i = 1; i <= pdf.numPages; i++) (function (n) {
        chain = chain.then(function () { return pdf.getPage(n); }).then(function (page) {
          return page.getTextContent();
        }).then(function (tc) {
          out.push(tc.items.map(function (it) { return it.str; }).join(' '));
          if (n % 10 === 0) status('PDF: página ' + n + ' de ' + pdf.numPages + '...');
        });
      })(i);
      return chain.then(function () {
        var t = out.join('\n');
        if (t.replace(/\s/g, '').length < 20) throw new Error('El PDF no tiene texto (¿es un escaneo?).');
        return t;
      });
    });
  }

  // ---------- EPUB ----------
  function readEpub(f) {
    var zip;
    return readBuf(f).then(function (b) { return JSZip.loadAsync(b); }).then(function (z) {
      zip = z;
      return zip.file('META-INF/container.xml').async('string');
    }).then(function (xml) {
      var opfPath = new DOMParser().parseFromString(xml, 'application/xml')
        .querySelector('rootfile').getAttribute('full-path');
      var base = opfPath.indexOf('/') >= 0 ? opfPath.replace(/[^/]*$/, '') : '';
      return zip.file(opfPath).async('string').then(function (opfXml) {
        var opf = new DOMParser().parseFromString(opfXml, 'application/xml');
        var manifest = {};
        Array.prototype.forEach.call(opf.getElementsByTagName('item'), function (it) {
          manifest[it.getAttribute('id')] = it.getAttribute('href');
        });
        var order = Array.prototype.map.call(opf.getElementsByTagName('itemref'), function (r) {
          return manifest[r.getAttribute('idref')];
        }).filter(Boolean);
        var parts = [], chain = Promise.resolve();
        order.forEach(function (href, i) {
          chain = chain.then(function () {
            var path = decodeURIComponent(base + href);
            var file = zip.file(path); if (!file) return;
            return file.async('string').then(function (html) {
              var doc = new DOMParser().parseFromString(html, 'text/html');
              doc.querySelectorAll('script,style').forEach(function (n) { n.remove(); });
              parts.push((doc.body ? doc.body.textContent : '') || '');
              if (i % 5 === 0) status('EPUB: capítulo ' + (i + 1) + ' de ' + order.length + '...');
            });
          });
        });
        return chain.then(function () { return parts.join('\n'); });
      });
    });
  }
})();
</script>
</body>
</html>
